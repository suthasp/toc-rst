.cs{background:#06130a;color:#00e676;border-color:#005522}.cs:hover{background:#005522;color:#fff}

<body>
<header>
  <div class="ht">
    <h1>❄ CHILLER PLANT MANAGEMENT SYSTEM (CPMS) — DATA CENTER TOC-RST</h1>
    <div class="sub">Water-Cooled Chiller ×4 &bull; CDP ×4 &bull; CHP ×4 &bull; Cooling Tower 8-Cell (CT-1/1 ~ CT-4/2) &bull; Dual Loop</div>
  </div>

  </div>
  <div class="clk" id="clk">--</div>

<div class="main"><canvas id="cvs"></canvas></div>
<div class="btm" id="btm"></div>

<script>
// ══════════════════════════════════════
//  STATE
// ══════════════════════════════════════
const EQ={
  ch:[
    {id:'CH-01',run:true, fault:false,load:74,kw:452,cop:5.22,chws:7.1,chwr:12.3,cws:32.0,cwr:37.1},
    {id:'CH-02',run:true, fault:false,load:69,kw:420,cop:5.28,chws:7.2,chwr:12.1,cws:32.2,cwr:36.8},
    {id:'CH-03',run:false,fault:false,load:0, kw:0,  cop:0,   chws:0,  chwr:0,  cws:0,   cwr:0},
    {id:'CH-04',run:false,fault:false,load:0, kw:0,  cop:0,   chws:0,  chwr:0,  cws:0,   cwr:0}
  ],
  cdp:[
    {id:'CDP-01',run:true, fault:false,flow:482,kw:18.6},
    {id:'CDP-02',run:true, fault:false,flow:476,kw:18.2},
    {id:'CDP-03',run:false,fault:false,flow:0,  kw:0},
    {id:'CDP-04',run:false,fault:false,flow:0,  kw:0}
  ],
  chp:[
    {id:'CHP-01',run:true, fault:false,flow:402,kw:15.3},
    {id:'CHP-02',run:true, fault:false,flow:396,kw:15.0},
    {id:'CHP-03',run:false,fault:false,flow:0,  kw:0},
    {id:'CHP-04',run:false,fault:false,flow:0,  kw:0}
  ],
  ct:[
    {id:'CT-1/1',run:true, fault:false,kw:4522},
    {id:'CT-1/2',run:true, fault:false,kw:3461},
    {id:'CT-2/1',run:true, fault:false,kw:4297},
    {id:'CT-2/2',run:false,fault:false,kw:0},
    {id:'CT-3/1',run:false,fault:false,kw:0},
    {id:'CT-3/2',run:false,fault:false,kw:0},
    {id:'CT-4/1',run:false,fault:false,kw:0},
    {id:'CT-4/2',run:false,fault:false,kw:0}
  ],
  tower:{ewt:37.2,lwt:32.0}
};
const ALARMS=[];
function pushAlarm(id,msg){ALARMS.unshift({id,msg,t:new Date().toLocaleTimeString('th-TH',{hour12:false})});if(ALARMS.length>20)ALARMS.pop();renderBtm();}

// ══════════════════════════════════════
//  CANVAS + SCALE
// ══════════════════════════════════════
const cvs=document.getElementById('cvs');
const ctx=cvs.getContext('2d');
let W,H,T=0;
function rsz(){W=cvs.parentElement.clientWidth;H=cvs.parentElement.clientHeight;cvs.width=W;cvs.height=H;}
rsz(); window.addEventListener('resize',rsz);

const RW=1380, RH=640; // reference space
function SC(){return Math.min(W/RW,H/RH);}
function OX(){return (W-RW*SC())/2;}
function OY(){return (H-RH*SC())/2;}
function rx(x){return OX()+x*SC();}
function ry(y){return OY()+y*SC();}
function rs(v){return v*SC();}

// ══════════════════════════════════════
//  COLOR HELPERS
// ══════════════════════════════════════
function h2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function lighter(col,a){const[r,g,b]=h2rgb(col);return`rgb(${Math.min(255,r+a)},${Math.min(255,g+a)},${Math.min(255,b+a)})`;}
function darker(col,a){const[r,g,b]=h2rgb(col);return`rgb(${Math.max(0,r-a)},${Math.max(0,g-a)},${Math.max(0,b-a)})`;}

// Pipe palette (CPMS-style)
const PC={CDR:'#ff7700',CDS:'#ccbb00',CHS:'#00ccff',CHR:'#1155ee'};

// ══════════════════════════════════════
//  3D DRAW PRIMITIVES
// ══════════════════════════════════════
function rrPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

// 3D gradient tube pipe
function pipe3D(x1,y1,x2,y2,col,w){
  if(w<rs(1)) return;
  const ang=Math.atan2(y2-y1,x2-x1);
  const nx=Math.sin(ang), ny=-Math.cos(ang);
  // Drop shadow
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=rs(4);ctx.shadowOffsetX=rs(1.5);ctx.shadowOffsetY=rs(2);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
  ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=w+rs(3);ctx.lineCap='round';ctx.stroke();
  ctx.restore();
  // Gradient across tube width
  const gx1=x1+nx*(w*.5),gy1=y1+ny*(w*.5),gx2=x1-nx*(w*.5),gy2=y1-ny*(w*.5);
  const g=ctx.createLinearGradient(gx1,gy1,gx2,gy2);
  g.addColorStop(0,lighter(col,80));
  g.addColorStop(.28,col);
  g.addColorStop(.65,col);
  g.addColorStop(1,darker(col,70));
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
  ctx.strokeStyle=g;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke();
  // Specular highlight
  ctx.beginPath();ctx.moveTo(x1-nx*w*.32,y1-ny*w*.32);ctx.lineTo(x2-nx*w*.32,y2-ny*w*.32);
  ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=w*.18;ctx.stroke();
}

// 3D isometric box
function box3D(x,y,w,h,d,fc,tc,sc){
  const r=rs(5);
  // Shadow
  ctx.save();ctx.shadowColor='rgba(0,0,0,.65)';ctx.shadowBlur=rs(10);ctx.shadowOffsetX=rs(3);ctx.shadowOffsetY=rs(5);
  rrPath(x,y,w,h,r);ctx.fillStyle='rgba(0,0,0,.5)';ctx.fill();ctx.restore();
  // Top face
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+d,y-d);ctx.lineTo(x+w+d,y-d);ctx.lineTo(x+w,y);ctx.closePath();
  ctx.fillStyle=tc;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=rs(.5);ctx.stroke();
  // Right face
  ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x+w+d,y-d);ctx.lineTo(x+w+d,y+h-d);ctx.lineTo(x+w,y+h);ctx.closePath();
  ctx.fillStyle=sc;ctx.fill();ctx.stroke();
  // Front face
  rrPath(x,y,w,h,r);ctx.fillStyle=fc;ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=rs(1);rrPath(x,y,w,h,r);ctx.stroke();
}

// 3D cylinder pump
function cylinder3D(cx,cy,ew,eh,ch,col,run,fault){
  const fc=fault?'#cc1111':run?lighter(col,45):darker(col,40);
  const sg=ctx.createLinearGradient(cx-ew,cy,cx+ew,cy);
  sg.addColorStop(0,darker(col,55));sg.addColorStop(.38,col);sg.addColorStop(.62,col);sg.addColorStop(1,darker(col,60));
  // Shadow
  ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=rs(6);ctx.shadowOffsetX=rs(2);ctx.shadowOffsetY=rs(3);
  ctx.beginPath();ctx.ellipse(cx,cy+ch,ew,eh,0,0,Math.PI*2);ctx.fillStyle=darker(col,55);ctx.fill();ctx.restore();
  // Barrel
  ctx.beginPath();
  ctx.moveTo(cx-ew,cy);ctx.lineTo(cx-ew,cy+ch);
  ctx.ellipse(cx,cy+ch,ew,eh,0,Math.PI,0,true);
  ctx.lineTo(cx+ew,cy);ctx.ellipse(cx,cy,ew,eh,0,0,Math.PI,true);
  ctx.fillStyle=sg;ctx.fill();
  // Top cap
  ctx.beginPath();ctx.ellipse(cx,cy,ew,eh,0,0,Math.PI*2);ctx.fillStyle=fc;ctx.fill();
  // Sheen
  ctx.beginPath();ctx.ellipse(cx-ew*.22,cy-eh*.22,ew*.45,eh*.38,-.3,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.16)';ctx.fill();
  // Spinning blades
  if(run){
    for(let b=0;b<4;b++){const a=T*4.5+b*Math.PI/2;ctx.save();ctx.translate(cx,cy);ctx.rotate(a);ctx.beginPath();ctx.ellipse(ew*.32,0,ew*.3,eh*.25,0,0,Math.PI*2);ctx.fillStyle='rgba(0,200,80,.28)';ctx.fill();ctx.restore();}
    ctx.beginPath();ctx.ellipse(cx,cy,ew*.16,eh*.16,0,0,Math.PI*2);ctx.fillStyle='rgba(0,255,80,.75)';ctx.fill();
  }
}

// ══════════════════════════════════════
//  LAYOUT CONSTANTS (ref-space pixels)
// ══════════════════════════════════════
// Chillers
const CH_X=[52,178,304,430], CH_Y=140, CH_W=108, CH_H=160;
// Pipes (horizontal buses)
const CDR_BUS_Y=126, CDS_BUS_Y=142;
const CHS_BUS_Y=248, CHR_BUS_Y=332;
const CHW_BUS_X=558; // vertical bus right of chillers
const CDP_BUS_Y=545, CDP_DIS_Y=520;
// Pumps
const CDP_X=[72,158,244,330], CDP_Y=500;
const CHP_X=[390,462,534,606], CHP_Y=470;
// Cooling Tower (right half)
const CT_OX=760; // x origin of CT section
const CT_CX=[CT_OX+50,CT_OX+50,CT_OX+182,CT_OX+182,CT_OX+314,CT_OX+314,CT_OX+446,CT_OX+446];
const CT_CY=[148,308,148,308,148,308,148,308];
const CT_RW=100,CT_RH=130;
// AHU/supply label position
const AHU_X=CT_OX+35, AHU_Y=460;
// Div line
const DIV_X=740;

// ══════════════════════════════════════
//  FLOW DOT ANIMATOR
// ══════════════════════════════════════
function flowDots(pts,col,on,spd=1.3){
  if(!on||pts.length<2)return;
  let tot=0;
  for(let i=1;i<pts.length;i++)tot+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  if(tot<2)return;
  for(const off of[0,.34,.67]){
    let d=((T*spd*60+off*tot)%tot),rem=d,px=pts[0][0],py=pts[0][1];
    for(let i=1;i<pts.length;i++){const sg=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);if(rem<=sg){const f=rem/sg;px=pts[i-1][0]+f*(pts[i][0]-pts[i-1][0]);py=pts[i-1][1]+f*(pts[i][1]-pts[i-1][1]);break;}rem-=sg;}
    ctx.beginPath();ctx.arc(px,py,rs(3.5),0,Math.PI*2);
    ctx.fillStyle=col;ctx.globalAlpha=.88;ctx.fill();ctx.globalAlpha=1;
  }
}

// ══════════════════════════════════════
//  DRAW PIPES
// ══════════════════════════════════════
function drawPipes(){
  const PW=rs(7),PD=rs(1.5);
  const chRun=EQ.ch.some(c=>c.run), cdpRun=EQ.cdp.some(p=>p.run), chpRun=EQ.chp.some(p=>p.run);

  // ── Condenser Water Return (CDR, orange) horizontal bus
  pipe3D(rx(35),ry(CDR_BUS_Y),rx(DIV_X-10),ry(CDR_BUS_Y),PC.CDR,chRun?PW:PD);
  // ── Condenser Water Supply (CDS, yellow) horizontal bus
  pipe3D(rx(35),ry(CDS_BUS_Y),rx(DIV_X-10),ry(CDS_BUS_Y),PC.CDS,cdpRun?PW:PD);
  // CDR/CDS → CT (right)
  pipe3D(rx(35),ry(CDR_BUS_Y),rx(35),ry(75),PC.CDR,chRun?PW:PD);
  pipe3D(rx(35),ry(75),rx(RW-10),ry(75),PC.CDR,chRun?PW:PD);
  pipe3D(rx(DIV_X-10),ry(CDS_BUS_Y),rx(DIV_X-10),ry(88),PC.CDS,cdpRun?PW:PD);
  pipe3D(rx(DIV_X-10),ry(88),rx(RW-10),ry(88),PC.CDS,cdpRun?PW:PD);

  // Per-chiller CDR out (top-left) / CDS in (top-right)
  CH_X.forEach((cx,i)=>{
    pipe3D(rx(cx+CH_W*.32),ry(CH_Y),rx(cx+CH_W*.32),ry(CDR_BUS_Y),PC.CDR,EQ.ch[i].run?PW:PD);
    pipe3D(rx(cx+CH_W*.68),ry(CDS_BUS_Y),rx(cx+CH_W*.68),ry(CH_Y),PC.CDS,EQ.ch[i].run?PW:PD);
  });

  // CDP suction from CDS bus downward
  pipe3D(rx(CDP_X[0]),ry(CDS_BUS_Y),rx(CDP_X[0]),ry(CDP_BUS_Y),PC.CDS,cdpRun?PW:PD);
  pipe3D(rx(CDP_X[0]),ry(CDP_BUS_Y),rx(CDP_X[3]+20),ry(CDP_BUS_Y),PC.CDS,cdpRun?PW:PD);
  CDP_X.forEach((x,i)=>{
    pipe3D(rx(x),ry(CDP_BUS_Y),rx(x),ry(CDP_Y+rs(8)/SC()),PC.CDS,EQ.cdp[i].run?PW:PD);
    pipe3D(rx(x),ry(CDP_Y-rs(8)/SC()),rx(x),ry(CDP_DIS_Y),PC.CDR,EQ.cdp[i].run?PW:PD);
  });
  // CDP discharge back up to CDR bus
  pipe3D(rx(CDP_X[0]),ry(CDP_DIS_Y),rx(CDP_X[3]+20),ry(CDP_DIS_Y),PC.CDR,cdpRun?PW:PD);

  // ── Chilled Water Supply (CHS, cyan) ──
  // Horizontal bus on right of chillers
  CH_X.forEach((cx,i)=>{
    pipe3D(rx(cx+CH_W),ry(CH_Y+38),rx(CHW_BUS_X),ry(CH_Y+38),PC.CHS,EQ.ch[i].run?PW:PD);
  });
  pipe3D(rx(CHW_BUS_X),ry(CH_Y+38),rx(CHW_BUS_X),ry(CHS_BUS_Y),PC.CHS,chpRun?PW:PD);
  pipe3D(rx(CHW_BUS_X),ry(CHS_BUS_Y),rx(RW-20),ry(CHS_BUS_Y),PC.CHS,chpRun?PW:PD);
  // CHP suction
  CHP_X.forEach((x,i)=>{
    pipe3D(rx(x),ry(CHS_BUS_Y),rx(x),ry(CHP_Y-rs(8)/SC()),PC.CHS,EQ.chp[i].run?PW:PD);
    pipe3D(rx(x),ry(CHP_Y+rs(8)/SC()),rx(x),ry(CHR_BUS_Y),PC.CHR,EQ.chp[i].run?PW:PD);
  });

  // ── Chilled Water Return (CHR, blue) ──
  CH_X.forEach((cx,i)=>{
    pipe3D(rx(cx+CH_W),ry(CH_Y+CH_H*.6),rx(CHW_BUS_X),ry(CH_Y+CH_H*.6),PC.CHR,EQ.ch[i].run?PW:PD);
  });
  pipe3D(rx(CHW_BUS_X),ry(CH_Y+CH_H*.6),rx(CHW_BUS_X),ry(CHR_BUS_Y),PC.CHR,chpRun?PW:PD);
  pipe3D(rx(CHW_BUS_X),ry(CHR_BUS_Y),rx(RW-20),ry(CHR_BUS_Y),PC.CHR,chpRun?PW:PD);

  // ── FLOW DOTS ──
  if(chRun){
    CH_X.forEach((cx,i)=>{if(!EQ.ch[i].run)return;
      flowDots([[rx(cx+CH_W*.32),ry(CH_Y)],[rx(cx+CH_W*.32),ry(CDR_BUS_Y)],[rx(35),ry(CDR_BUS_Y)],[rx(35),ry(75)],[rx(RW-10),ry(75)]],lighter(PC.CDR,40),true,1.1);
    });
  }
  if(cdpRun){
    CDP_X.forEach((x,i)=>{if(!EQ.cdp[i].run)return;
      flowDots([[rx(DIV_X-10),ry(88)],[rx(x),ry(88)],[rx(x),ry(CDS_BUS_Y)],[rx(x),ry(CDP_BUS_Y)],[rx(x),ry(CDP_Y-rs(8)/SC())]],lighter(PC.CDS,40),true,.9);
    });
  }
  if(chpRun&&chRun){
    flowDots([[rx(CHW_BUS_X),ry(CH_Y+38)],[rx(CHW_BUS_X),ry(CHS_BUS_Y)],[rx(RW-20),ry(CHS_BUS_Y)]],lighter(PC.CHS,30),true,1.4);
  }
  if(chpRun){
    flowDots([[rx(RW-20),ry(CHR_BUS_Y)],[rx(CHW_BUS_X),ry(CHR_BUS_Y)],[rx(CHW_BUS_X),ry(CH_Y+CH_H*.6)]],lighter(PC.CHR,50),true,1.3);
  }
}

// ══════════════════════════════════════
//  DRAW CHILLER (3D)
// ══════════════════════════════════════
function drawChiller3D(i){
  const eq=EQ.ch[i];
  const x=rx(CH_X[i]),y=ry(CH_Y),w=rs(CH_W),h=rs(CH_H),d=rs(11);
  const run=eq.run,flt=eq.fault;
  const fc=flt?'#220606':run?'#061420':'#080f1a';
  const tc=flt?'#310808':run?'#0a1e30':'#0c1420';
  const sc=flt?'#180404':run?'#04101a':'#060c14';
  box3D(x,y,w,h,d,fc,tc,sc);
  // 3D compressor
  const ccx=x+w/2,ccy=y+h*.42,cr=rs(26);
  const cg=ctx.createRadialGradient(ccx-cr*.3,ccy-cr*.3,cr*.05,ccx,ccy,cr);
  cg.addColorStop(0,run?'#1a4a78':'#1a2232');cg.addColorStop(1,run?'#061828':'#06101a');
  ctx.beginPath();ctx.arc(ccx,ccy,cr,0,Math.PI*2);ctx.fillStyle=cg;ctx.fill();
  ctx.strokeStyle=run?'#0099cc':flt?'#880000':'#1a3040';ctx.lineWidth=rs(2);ctx.stroke();
  if(run){
    for(let b=0;b<6;b++){const a=T*2.8+b*Math.PI/3;ctx.save();ctx.translate(ccx,ccy);ctx.rotate(a);ctx.beginPath();ctx.ellipse(cr*.58,0,cr*.4,cr*.13,.22,0,Math.PI*2);ctx.fillStyle='rgba(0,155,235,.24)';ctx.fill();ctx.restore();}
    // Inner glow ring
    const ig=ctx.createRadialGradient(ccx,ccy,cr*.1,ccx,ccy,cr*.5);
    ig.addColorStop(0,'rgba(0,200,255,.18)');ig.addColorStop(1,'rgba(0,200,255,0)');
    ctx.beginPath();ctx.arc(ccx,ccy,cr*.5,0,Math.PI*2);ctx.fillStyle=ig;ctx.fill();
    ctx.beginPath();ctx.arc(ccx,ccy,cr*.15,0,Math.PI*2);ctx.fillStyle='#00ccff';ctx.fill();
  }
  // Labels
  const lc=flt?'#ff5252':run?'#40c4ff':'#334455';
  ctx.textAlign='center';
  ctx.fillStyle=lc;ctx.font=`bold ${rs(12)}px JetBrains Mono,monospace`;
  ctx.fillText(eq.id,ccx,y+h*.9);
  if(run){
    ctx.fillStyle='#00e676';ctx.font=`${rs(10)}px JetBrains Mono,monospace`;
    ctx.fillText(eq.load+'%  '+eq.kw+'kW',ccx,y+h*1.0);
    ctx.textAlign='left';ctx.font=`bold ${rs(10)}px JetBrains Mono,monospace`;
    ctx.fillStyle='#00ccff';ctx.fillText('S:'+eq.chws.toFixed(1)+'°',x+rs(4),y+rs(16));
    ctx.fillStyle='#ff9800';ctx.fillText('R:'+eq.chwr.toFixed(1)+'°',x+rs(4),y+rs(28));
    ctx.fillStyle='#ff7744';ctx.fillText('CWS '+eq.cws.toFixed(1)+'°',x+rs(4),y+h*.68);
    ctx.fillStyle='#ff4422';ctx.fillText('CWR '+eq.cwr.toFixed(1)+'°',x+rs(4),y+h*.8);
  } else {
    ctx.textAlign='center';ctx.fillStyle='#2a4050';ctx.font=`${rs(11)}px Noto Sans Thai,sans-serif`;
    ctx.fillText(flt?'FAULT':'STANDBY',ccx,y+h*.99);
  }
}

// ══════════════════════════════════════
//  DRAW PUMP (3D cylinder)
// ══════════════════════════════════════
function drawPump3D(cx,cy,p,isCHP){
  const col=isCHP?'#006688':'#336611';
  const ew=rs(19),eh=rs(8),ch=rs(28);
  cylinder3D(cx,cy,ew,eh,ch,col,p.run,p.fault);
  const tc=p.fault?'#ff5252':p.run?'#00e676':'#334455';
  ctx.textAlign='center';
  ctx.fillStyle=tc;ctx.font=`bold ${rs(10)}px JetBrains Mono,monospace`;
  ctx.fillText(p.id,cx,cy+ch+rs(14));
  if(p.run&&p.kw>0){ctx.fillStyle='#445566';ctx.font=`${rs(9)}px JetBrains Mono,monospace`;ctx.fillText(p.kw.toFixed(1)+'kW',cx,cy+ch+rs(25));}
}

// ══════════════════════════════════════
//  DRAW COOLING TOWER 3D (Full Structure)
// ══════════════════════════════════════
function drawCoolingTower3D(){
  const tx=rx(762),ty=ry(18),tw=rs(602),th=rs(470),d3=rs(14);

  // ── Tower shell (3D box) ──
  const fc='#06101c',tc='#091828',sc2='#040d16';
  box3D(tx,ty,tw,th,d3,fc,tc,sc2);

  // ── Fan Deck header bar ──
  rrPath(tx+rs(3),ty+rs(3),tw-rs(6),rs(26),rs(4));
  ctx.fillStyle='rgba(8,28,48,.9)';ctx.fill();
  ctx.strokeStyle='#1a4a6a';ctx.lineWidth=rs(1);ctx.stroke();
  ctx.textAlign='center';ctx.fillStyle='#2a7aaa';ctx.font=`bold ${rs(11)}px Noto Sans Thai,sans-serif`;
  ctx.fillText('⚙ COOLING TOWER PLANT — Fan Deck  (8 Cells)',tx+tw/2,ty+rs(18));

  // ── 8 Fan Cells (4 cols × 2 rows) ──
  const cols=4,rows=2;
  const cellW=tw/cols, cellH=rs(185);
  for(let i=0;i<8;i++){
    const col=i%cols, row=Math.floor(i/cols);
    const fcx=tx+col*cellW+cellW/2;
    const fcy=ty+rs(32)+row*rs(100)+rs(45);
    const fr=rs(36);
    const eq=EQ.ct[i];
    const run=eq.run,flt=eq.fault;
    const bc=flt?'#992200':run?'#0a5a7a':'#1a3040';

    // Cell divider
    if(col>0){ctx.beginPath();ctx.moveTo(tx+col*cellW,ty+rs(30));ctx.lineTo(tx+col*cellW,ty+rs(30)+cellH);ctx.strokeStyle='rgba(20,60,90,.5)';ctx.lineWidth=rs(1);ctx.stroke();}

    // Fan housing
    ctx.beginPath();ctx.arc(fcx,fcy,fr+rs(5),0,Math.PI*2);
    ctx.fillStyle=flt?'#1c0505':run?'#04121e':'#060e16';ctx.fill();
    ctx.strokeStyle=bc;ctx.lineWidth=rs(2);ctx.stroke();

    // Fan ring
    ctx.beginPath();ctx.arc(fcx,fcy,fr,0,Math.PI*2);
    ctx.strokeStyle=run?'#0077aa':'#1a3040';ctx.lineWidth=rs(1.5);ctx.stroke();

    // Blades
    if(run){
      for(let b=0;b<5;b++){
        const a=T*5.5+b*Math.PI*2/5;
        ctx.save();ctx.translate(fcx,fcy);ctx.rotate(a);
        ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,fr*.78,-.22,.32);ctx.closePath();
        ctx.fillStyle='rgba(0,140,210,.42)';ctx.fill();ctx.restore();
      }
      ctx.beginPath();ctx.arc(fcx,fcy,fr+rs(2),0,Math.PI*2);
      ctx.strokeStyle='rgba(0,190,230,.3)';ctx.lineWidth=rs(2.5);ctx.stroke();
      ctx.beginPath();ctx.arc(fcx,fcy,fr*.12,0,Math.PI*2);ctx.fillStyle='#00ccee';ctx.fill();
    } else if(flt){
      ctx.beginPath();ctx.arc(fcx,fcy,fr*.5,0,Math.PI*2);ctx.strokeStyle='rgba(255,50,50,.3)';ctx.lineWidth=rs(2);ctx.stroke();
    }

    // Label
    const lc=flt?'#ff5252':run?'#40c4ff':'#2a4466';
    ctx.textAlign='center';
    ctx.fillStyle=lc;ctx.font=`bold ${rs(10)}px JetBrains Mono,monospace`;
    ctx.fillText(eq.id,fcx,fcy+fr+rs(14));
    ctx.fillStyle=run?'#00e676':'#223a4a';ctx.font=`${rs(9)}px JetBrains Mono,monospace`;
    ctx.fillText(run?eq.kw.toFixed(0)+'W':'STBY',fcx,fcy+fr+rs(25));
    // Auto tag
    rrPath(fcx-rs(14),fcy+fr+rs(28),rs(28),rs(11),rs(3));
    ctx.fillStyle=run?'#072a12':'#0e1a22';ctx.fill();
    ctx.fillStyle=run?'#00cc55':'#2a4050';ctx.font=`bold ${rs(8)}px JetBrains Mono,monospace`;
    ctx.fillText('Auto',fcx,fcy+fr+rs(37));
  }

  // ── Hot water inlet spray (top of fill) ──
  const sprayY=ty+rs(215);
  for(let n=0;n<8;n++){
    const nx=tx+(n+.5)*tw/8;
    for(let sp=0;sp<3;sp++){
      const f=((T*1.0*60+sp*20+n*7)%40)/40;
      const sy=sprayY+f*rs(28);
      const sr=rs(1.8-f*1.6);
      if(sr>0){ctx.beginPath();ctx.arc(nx+(Math.random()-.5)*rs(6),sy,sr,0,Math.PI*2);ctx.fillStyle=`rgba(80,180,255,${.65-f*.5})`;ctx.fill();}
    }
  }

  // ── Fill Media zone ──
  const fillY=ty+rs(222),fillH=rs(120);
  rrPath(tx+rs(4),fillY,tw-rs(8),fillH,rs(4));
  ctx.fillStyle='rgba(6,18,30,.75)';ctx.fill();
  ctx.strokeStyle='#1a3a52';ctx.lineWidth=rs(1);ctx.stroke();
  // Hatch lines
  ctx.save();ctx.beginPath();rrPath(tx+rs(4),fillY,tw-rs(8),fillH,rs(4));ctx.clip();
  ctx.strokeStyle='rgba(20,65,100,.55)';ctx.lineWidth=rs(1.2);
  for(let xi=-fillH;xi<tw+fillH;xi+=rs(9)){ctx.beginPath();ctx.moveTo(tx+xi,fillY);ctx.lineTo(tx+xi+fillH,fillY+fillH);ctx.stroke();}
  ctx.restore();
  // Falling droplets
  for(let dr=0;dr<28;dr++){
    const dxp=((dr*53)%(tw-rs(20)));
    const dyp=((T*0.65*60+dr*29)%fillH);
    ctx.beginPath();ctx.arc(tx+rs(10)+dxp,fillY+dyp,rs(2),0,Math.PI*2);
    ctx.fillStyle='rgba(70,170,240,.55)';ctx.fill();
  }
  ctx.textAlign='center';ctx.fillStyle='#1a5a78';ctx.font=`bold ${rs(10)}px Noto Sans Thai,sans-serif`;
  ctx.fillText('Fill Media — Heat Exchange Zone',tx+tw/2,fillY+fillH*.55);

  // ── Drift Eliminator bar ──
  ctx.fillStyle='rgba(10,28,44,.8)';ctx.fillRect(tx+rs(4),fillY-rs(8),tw-rs(8),rs(7));
  ctx.fillStyle='#1a4a60';ctx.font=`${rs(8.5)}px JetBrains Mono,monospace`;ctx.textAlign='center';
  ctx.fillText('Drift Eliminator',tx+tw/2,fillY-rs(2));

  // ── Cold Water Basin ──
  const basinY=ty+rs(352),basinH=rs(90);
  rrPath(tx+rs(4),basinY,tw-rs(8),basinH,rs(5));
  ctx.fillStyle='rgba(6,22,40,.85)';ctx.fill();
  ctx.strokeStyle='#1a4a6a';ctx.lineWidth=rs(1.5);ctx.stroke();
  // Water surface
  const wg=ctx.createLinearGradient(tx,basinY,tx,basinY+basinH);
  wg.addColorStop(0,'rgba(15,90,150,.5)');wg.addColorStop(1,'rgba(8,45,80,.3)');
  rrPath(tx+rs(4),basinY+rs(6),tw-rs(8),basinH-rs(10),rs(4));ctx.fillStyle=wg;ctx.fill();
  // Ripples
  for(let r2=0;r2<5;r2++){
    const rw2=((T*.5*60+r2*22)%(tw*.48-rs(10)));
    ctx.beginPath();ctx.ellipse(tx+tw/2,basinY+basinH*.62,rw2,rw2*.12,0,0,Math.PI*2);
    ctx.strokeStyle=`rgba(50,160,220,${Math.max(0,.22-rw2/(tw*.48)*.22)})`;ctx.lineWidth=rs(1);ctx.stroke();
  }
  ctx.textAlign='center';ctx.fillStyle='#1a6a88';ctx.font=`bold ${rs(10.5)}px Noto Sans Thai,sans-serif`;
  ctx.fillText('Cold Water Basin',tx+tw/2,basinY+rs(20));
  ctx.fillStyle='#40c4ff';ctx.font=`bold ${rs(13)}px JetBrains Mono,monospace`;
  ctx.fillText('LWT: '+EQ.tower.lwt.toFixed(2)+' °C',tx+tw/2-rs(95),basinY+basinH*.72);
  ctx.fillStyle='#ff9800';
  ctx.fillText('EWT: '+EQ.tower.ewt.toFixed(2)+' °C',tx+tw/2+rs(95),basinY+basinH*.72);

  // ── CDR inlet label (hot water in, orange arrow) ──
  const inY=ry(75);
  ctx.fillStyle='rgba(80,30,0,.75)';rrPath(rx(762),inY-rs(10),rs(60),rs(20),rs(3));ctx.fill();
  ctx.fillStyle='#ff8800';ctx.font=`bold ${rs(9.5)}px JetBrains Mono,monospace`;ctx.textAlign='center';
  ctx.fillText('CDR IN →',rx(792),inY+rs(4));

  // ── CDS outlet label (cool water out, yellow arrow) ──
  const outY=basinY+basinH*.5;
  ctx.fillStyle='rgba(60,50,0,.75)';rrPath(rx(762),outY-rs(10),rs(65),rs(20),rs(3));ctx.fill();
  ctx.fillStyle='#ddcc00';ctx.font=`bold ${rs(9.5)}px JetBrains Mono,monospace`;ctx.textAlign='center';
  ctx.fillText('← CDS OUT',rx(795),outY+rs(4));

  // ── Bottom info strip ──
  rrPath(tx+rs(3),ty+th+rs(3),tw-rs(6),rs(20),rs(4));
  ctx.fillStyle='rgba(6,18,32,.88)';ctx.fill();ctx.strokeStyle='#1a3a5a';ctx.lineWidth=rs(1);ctx.stroke();
  ctx.textAlign='center';ctx.fillStyle='#2a6888';ctx.font=`bold ${rs(10)}px Noto Sans Thai,sans-serif`;
  const runCT=EQ.ct.filter(c=>c.run).length;
  ctx.fillText('Cooling Tower — '+runCT+'/8 Cells Running  |  EWT '+EQ.tower.ewt.toFixed(1)+'°C  →  LWT '+EQ.tower.lwt.toFixed(1)+'°C',tx+tw/2,ty+th+rs(14));
}

// ══════════════════════════════════════
//  INFO / LABELS PANELS
// ══════════════════════════════════════
function drawLabels(){
  const rCH=EQ.ch.filter(c=>c.run);
  const chws=rCH.length?rCH.reduce((a,c)=>a+c.chws,0)/rCH.length:0;
  const chwr=rCH.length?rCH.reduce((a,c)=>a+c.chwr,0)/rCH.length:0;
  const totalKW=EQ.ch.reduce((a,c)=>a+c.kw,0);

  // ── Left info panel ──
  const px=rx(8),py=ry(22),pw=rs(148),ph=rs(100);
  rrPath(px,py,pw,ph,rs(5));ctx.fillStyle='rgba(10,22,38,.88)';ctx.fill();
  ctx.strokeStyle='#2a5a8a';ctx.lineWidth=rs(1.2);rrPath(px,py,pw,ph,rs(5));ctx.stroke();
  ctx.textAlign='left';
  ctx.fillStyle='#3a6a88';ctx.font=`bold ${rs(9.5)}px Noto Sans Thai,sans-serif`;ctx.fillText('PLANT SYSTEM',px+rs(8),py+rs(14));
  ctx.fillStyle='#00e676';ctx.font=`bold ${rs(9.5)}px JetBrains Mono,monospace`;ctx.fillText('● Enable',px+rs(88),py+rs(14));
  ctx.fillStyle='#3a6a88';ctx.font=`${rs(9)}px sans-serif`;ctx.fillText('CHILLED SUPPLY',px+rs(8),py+rs(28));
  ctx.fillStyle='#00ccff';ctx.font=`bold ${rs(14)}px JetBrains Mono,monospace`;ctx.fillText(chws.toFixed(2)+' °C',px+rs(8),py+rs(44));
  ctx.fillStyle='#3a6a88';ctx.font=`${rs(9)}px sans-serif`;ctx.fillText('CHILLED SETPOINT',px+rs(8),py+rs(58));
  ctx.fillStyle='#ffd740';ctx.font=`bold ${rs(13)}px JetBrains Mono,monospace`;ctx.fillText('7.22 °C',px+rs(8),py+rs(73));
  ctx.fillStyle='#3a5a70';ctx.font=`${rs(9)}px JetBrains Mono,monospace`;ctx.fillText('TOTAL: '+totalKW.toFixed(0)+' kW',px+rs(8),py+rs(88));

  // ── Tower temperatures ──
  ctx.textAlign='left';ctx.font=`bold ${rs(10)}px JetBrains Mono,monospace`;
  ctx.fillStyle='#ff7700';ctx.fillText('CDR-A TEMP: '+EQ.tower.ewt.toFixed(2)+'°C',rx(CT_OX+5),ry(75));
  ctx.fillStyle='#ccbb00';ctx.fillText('CDS-A TEMP: '+EQ.tower.lwt.toFixed(2)+'°C',rx(CT_OX+5),ry(88));

  // ── Section divider ──
  ctx.setLineDash([rs(5),rs(4)]);
  ctx.beginPath();ctx.moveTo(rx(DIV_X),ry(18));ctx.lineTo(rx(DIV_X),ry(RH-18));
  ctx.strokeStyle='rgba(25,70,110,.5)';ctx.lineWidth=rs(1);ctx.stroke();
  ctx.setLineDash([]);

  // ── Section titles ──
  ctx.textAlign='center';ctx.fillStyle='#1a4a6a';ctx.font=`bold ${rs(12)}px Noto Sans Thai,sans-serif`;
  ctx.fillText('— Chiller Plant —',rx(DIV_X/2),ry(RH-10));
  ctx.fillText('— Cooling Tower Plant —',rx((DIV_X+RW)/2),ry(RH-10));

  // ── Pipe section headers ──
  ctx.textAlign='left';ctx.font=`bold ${rs(10)}px JetBrains Mono,monospace`;
  ctx.fillStyle='#ff7700';ctx.fillText('CDR',rx(170),ry(CDR_BUS_Y-4));
  ctx.fillStyle='#ccbb00';ctx.fillText('CDS',rx(170),ry(CDS_BUS_Y+12));
  ctx.fillStyle='#00ccff';ctx.fillText('CHS  '+chws.toFixed(1)+'°C',rx(CHW_BUS_X+5),ry(CHS_BUS_Y-4));
  ctx.fillStyle='#1155ee';ctx.fillText('CHR  '+chwr.toFixed(1)+'°C',rx(CHW_BUS_X+5),ry(CHR_BUS_Y-4));

  // ── Pump section labels ──
  ctx.fillStyle='#1a4a5a';ctx.font=`bold ${rs(11)}px Noto Sans Thai,sans-serif`;ctx.textAlign='center';
  ctx.fillText('Condenser Water Pump',rx((CDP_X[0]+CDP_X[3])/2),ry(548));
  ctx.fillText('CDP-01 ~ CDP-04',rx((CDP_X[0]+CDP_X[3])/2),ry(560));
  ctx.fillText('Chilled Water Pump',rx((CHP_X[0]+CHP_X[3])/2),ry(520));
  ctx.fillText('CHP-01 ~ CHP-04',rx((CHP_X[0]+CHP_X[3])/2),ry(532));

  // ── Legend (bottom) ──
  const lgY=ry(RH-28), lgX=rx(172);
  const lgItems=[
    {c:PC.CDR,l:'CDR — Condenser Return (Hot)'},
    {c:PC.CDS,l:'CDS — Condenser Supply (Cool)'},
    {c:PC.CHS,l:'CHS — Chilled Supply (Cold)'},
    {c:PC.CHR,l:'CHR — Chilled Return (Warm)'}
  ];
  lgItems.forEach((it,i)=>{
    pipe3D(lgX+i*rs(200),lgY,lgX+i*rs(200)+rs(24),lgY,it.c,rs(5));
    ctx.fillStyle='#3a5060';ctx.font=`${rs(10.5)}px Noto Sans Thai,sans-serif`;ctx.textAlign='left';
    ctx.fillText(it.l,lgX+i*rs(200)+rs(28),lgY+rs(4));
  });
}

// ══════════════════════════════════════
//  MAIN DRAW
// ══════════════════════════════════════
function draw(){
  ctx.clearRect(0,0,W,H);
  // Background
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#162538');bg.addColorStop(1,'#1e3248');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // Grid
  ctx.strokeStyle='rgba(50,100,160,.22)';ctx.lineWidth=.6;
  for(let x=0;x<W;x+=rs(40)){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=rs(40)){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  drawPipes();
  for(let i=0;i<4;i++) drawChiller3D(i);
  CDP_X.forEach((x,i)=>drawPump3D(rx(x),ry(CDP_Y),EQ.cdp[i],false));
  CHP_X.forEach((x,i)=>drawPump3D(rx(x),ry(CHP_Y),EQ.chp[i],true));
  drawCoolingTower3D();
  drawLabels();
}

// ══════════════════════════════════════
//  SIMULATION
// ══════════════════════════════════════
let tick=0;
function rw(v,d,lo,hi){return Math.max(lo,Math.min(hi,v+(Math.random()-.5)*d));}
function simulate(){
  tick++;if(tick%4!==0)return;
  EQ.ch.forEach(c=>{if(!c.run)return;c.load=rw(c.load,1.2,55,90);c.kw=rw(c.kw,8,320,580);c.cop=rw(c.cop,.04,4.8,6.2);c.chws=rw(c.chws,.04,6.5,7.8);c.chwr=rw(c.chwr,.04,11.5,13.0);c.cws=rw(c.cws,.06,30,34);c.cwr=rw(c.cwr,.06,35,38.5);});
  EQ.cdp.forEach(p=>{if(p.run){p.flow=rw(p.flow,4,440,520);p.kw=rw(p.kw,.2,16,22);}});
  EQ.chp.forEach(p=>{if(p.run){p.flow=rw(p.flow,4,360,440);p.kw=rw(p.kw,.2,13,18);}});
  EQ.ct.forEach(c=>{if(c.run)c.kw=rw(c.kw,50,3000,5200);});
  const rCH=EQ.ch.filter(c=>c.run);
  if(rCH.length){EQ.tower.ewt=rw(rCH.reduce((a,c)=>a+c.cwr,0)/rCH.length,.08,35,39);EQ.tower.lwt=rw(EQ.tower.ewt-5.5,.05,28,33);}
  updateBadges();
}
function updateBadges(){
  const rCH=EQ.ch.filter(c=>c.run);
  const rP=[...EQ.cdp,...EQ.chp].filter(p=>p.run);
  const flt=[...EQ.ch,...EQ.cdp,...EQ.chp].some(e=>e.fault);
  document.getElementById('bSys').textContent=flt?'⚠ FAULT':'● NORMAL';
  document.getElementById('bSys').className='badge '+(flt?'br':'bg');
  document.getElementById('bCH').textContent='CH '+rCH.length+'/4';
  document.getElementById('bPump').textContent='PUMP '+rP.length+'/8';
  document.getElementById('bLoad').textContent=EQ.ch.reduce((a,c)=>a+c.kw,0).toFixed(0)+' kW';
}

// ══════════════════════════════════════
//  CONTROLS
// ══════════════════════════════════════
function allOn(){[...EQ.ch,...EQ.cdp,...EQ.chp,...EQ.ct].forEach(e=>{e.run=true;e.fault=false;});pushAlarm('SYS','All equipment started');renderBtm();}
function allOff(){[...EQ.ch,...EQ.cdp,...EQ.chp,...EQ.ct].forEach(e=>e.run=false);pushAlarm('SYS','All equipment stopped');renderBtm();}
function injectFault(){EQ.ch[0].run=false;EQ.ch[0].fault=true;pushAlarm('CH-01','High discharge pressure — tripped');renderBtm();}
function clearFaults(){[...EQ.ch,...EQ.cdp,...EQ.chp,...EQ.ct].forEach(e=>e.fault=false);pushAlarm('SYS','All faults cleared');renderBtm();}
function renderBtm(){
  const b=document.getElementById('btm');
  const ah=ALARMS.slice(0,3).map(a=>`<span class="ai">⚠ ${a.id}: ${a.msg}</span>`).join('');
  b.innerHTML=`
    <span style="font-size:9px;color:#223344">ระบบ:</span>
    <button class="cb cs" onclick="allOn()">▶ All ON</button>
    <button class="cb cx" onclick="allOff()">■ All OFF</button>
    <div class="bsp"></div>
    <button class="cb cw" onclick="injectFault()">⚡ Fault CH-01</button>
    <button class="cb cs" onclick="clearFaults()">✓ Clear</button>
    <div class="aw">${ah||'<span style="color:#1a2a36;font-size:9px">No Active Alarms</span>'}</div>`;
}

// ══════════════════════════════════════
//  CLOCK
// ══════════════════════════════════════
const TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function clkTick(){const d=new Date();document.getElementById('clk').textContent=d.toLocaleTimeString('th-TH',{hour12:false})+' '+d.getDate()+' '+TM[d.getMonth()]+' '+(d.getFullYear()+543);}
setInterval(clkTick,1000);clkTick();

// ══════════════════════════════════════
//  LOOP
// ══════════════════════════════════════
function loop(){T+=0.016;simulate();draw();requestAnimationFrame(loop);}
updateBadges();renderBtm();loop();
</script>
