  </div>

<script>
// ══ SCALING ══
const RW=1380,RH=610;
const cvs=document.getElementById('cvs');
const ctx=cvs.getContext('2d');
let W,H,T=0;
function rsz(){W=cvs.parentElement.clientWidth;H=cvs.parentElement.clientHeight;cvs.width=W;cvs.height=H;}
rsz();window.addEventListener('resize',rsz);
function SC(){return Math.min(W/RW,H/RH);}
function OX(){return(W-RW*SC())/2;}
function OY(){return(H-RH*SC())/2;}
function rx(x){return OX()+x*SC();}
function ry(y){return OY()+y*SC();}
function rs(v){return v*SC();}

// ══ STATE ══
const EQ={
  comp:{run:true,fault:false,mode:'COOLING',kw:14.2,rpm:3450},
  fan: {run:true,fault:false,kw:1.5},
  pump:{run:true,fault:false,flow:3.2,kw:0.75},
  tank:{temp:8.5,setpoint:7.0,heater:false},
  ref: {disch:18.4,suct:4.8,liqTemp:38.2,superheat:8.2,subcool:5.1,ref:'R410A'},
  evap:{wIn:12.4,wOut:7.2,dT:5.2},
  txv: {pos:42},
  sys: {coolingKw:48.0,cop:3.38,eer:16.4,ambient:34.5},
};
const ALARMS=[];
function pushAlarm(id,msg){ALARMS.unshift({id,msg,t:new Date().toLocaleTimeString('th-TH',{hour12:false})});if(ALARMS.length>15)ALARMS.pop();renderBtm();}

// ══ COLOR HELPERS ══
function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function lt(c,a){const[r,g,b]=h2r(c);return'rgb('+Math.min(255,r+a)+','+Math.min(255,g+a)+','+Math.min(255,b+a)+')';}
function dk(c,a){const[r,g,b]=h2r(c);return'rgb('+Math.max(0,r-a)+','+Math.max(0,g-a)+','+Math.max(0,b-a)+')';}

const C_HOT='#ff2222';   // hot gas discharge
const C_LIQ='#ff8800';   // liquid refrigerant
const C_VAP='#9955ff';   // low-pres / suction vapor
const C_CW ='#00ccff';   // chilled water supply
const C_CR ='#0088bb';   // chilled water return

// ══ PRIMITIVES ══
function rrP(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function box3D(x,y,w,h,d,fc,tc,sc){
  rrP(x,y+d,w,h,rs(3));ctx.fillStyle=fc;ctx.fill();ctx.strokeStyle=lt(fc,35);ctx.lineWidth=rs(.7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y+d);ctx.lineTo(x+d,y);ctx.lineTo(x+w+d,y);ctx.lineTo(x+w,y+d);ctx.closePath();
  ctx.fillStyle=tc;ctx.fill();ctx.strokeStyle=lt(tc,25);ctx.lineWidth=rs(.7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+w,y+d);ctx.lineTo(x+w+d,y);ctx.lineTo(x+w+d,y+h);ctx.lineTo(x+w,y+d+h);ctx.closePath();
  ctx.fillStyle=sc;ctx.fill();ctx.strokeStyle=lt(sc,15);ctx.lineWidth=rs(.7);ctx.stroke();
}

function pipe3D(x1,y1,x2,y2,col,w){
  if(w<rs(.8))return;
  const ang=Math.atan2(y2-y1,x2-x1),nx=Math.sin(ang),ny=-Math.cos(ang),hw=w/2;
  const[r,g,b]=h2r(col);
  const grd=ctx.createLinearGradient(x1-nx*hw,y1+ny*hw,x1+nx*hw,y1-ny*hw);
  grd.addColorStop(0,'rgba('+r+','+g+','+b+',.3)');
  grd.addColorStop(.3,'rgba('+Math.min(255,r+55)+','+Math.min(255,g+55)+','+Math.min(255,b+55)+',.9)');
  grd.addColorStop(.7,'rgba('+r+','+g+','+b+',.82)');
  grd.addColorStop(1,'rgba('+Math.max(0,r-35)+','+Math.max(0,g-35)+','+Math.max(0,b-35)+',.55)');
  ctx.beginPath();ctx.moveTo(x1-nx*hw,y1+ny*hw);ctx.lineTo(x1+nx*hw,y1-ny*hw);ctx.lineTo(x2+nx*hw,y2-ny*hw);ctx.lineTo(x2-nx*hw,y2+ny*hw);ctx.closePath();
  ctx.fillStyle=grd;ctx.fill();
  ctx.strokeStyle='rgba('+Math.min(255,r+75)+','+Math.min(255,g+75)+','+Math.min(255,b+75)+',.35)';ctx.lineWidth=rs(.4);ctx.stroke();
}

function cyl3D(cx,cy,ew,eh,ch,col,run,flt){
  const fc=flt?'#cc1111':run?lt(col,38):dk(col,38);
  const dc=flt?'#880000':run?col:dk(col,55);
  const grd=ctx.createLinearGradient(cx-ew/2,cy,cx+ew/2,cy);
  grd.addColorStop(0,dk(dc,28));grd.addColorStop(.35,lt(fc,22));grd.addColorStop(.65,dc);grd.addColorStop(1,dk(dc,45));
  ctx.beginPath();ctx.rect(cx-ew/2,cy-ch/2,ew,ch);ctx.fillStyle=grd;ctx.fill();ctx.strokeStyle=lt(dc,18);ctx.lineWidth=rs(1.1);ctx.stroke();
  ctx.beginPath();ctx.ellipse(cx,cy-ch/2,ew/2,eh/2,0,0,Math.PI*2);
  const tg=ctx.createRadialGradient(cx,cy-ch/2,0,cx,cy-ch/2,ew/2);
  tg.addColorStop(0,lt(fc,48));tg.addColorStop(1,dc);
  ctx.fillStyle=tg;ctx.fill();ctx.strokeStyle=lt(dc,28);ctx.lineWidth=rs(1);ctx.stroke();
  ctx.beginPath();ctx.ellipse(cx,cy+ch/2,ew/2,eh/2,0,0,Math.PI*2);ctx.fillStyle=dk(dc,38);ctx.fill();ctx.strokeStyle=dk(dc,18);ctx.lineWidth=rs(.8);ctx.stroke();
}

function polyPipe(pts,col,w){
  const cp=pts.map(p=>[rx(p[0]),ry(p[1])]);
  for(let i=1;i<cp.length;i++)pipe3D(cp[i-1][0],cp[i-1][1],cp[i][0],cp[i][1],col,rs(w));
}

function flowDot(pts,frac,col,r){
  const cp=pts.map(p=>[rx(p[0]),ry(p[1])]);
  let tot=0;
  for(let i=1;i<cp.length;i++){const dx=cp[i][0]-cp[i-1][0],dy=cp[i][1]-cp[i-1][1];tot+=Math.sqrt(dx*dx+dy*dy);}
  let tgt=frac*tot,cov=0;
  for(let i=1;i<cp.length;i++){
    const dx=cp[i][0]-cp[i-1][0],dy=cp[i][1]-cp[i-1][1],seg=Math.sqrt(dx*dx+dy*dy);
    if(cov+seg>=tgt){const t=(tgt-cov)/seg,x=cp[i-1][0]+t*dx,y=cp[i-1][1]+t*dy;
      const[cr,cg,cb]=h2r(col);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle='rgba('+cr+','+cg+','+cb+',.9)';ctx.fill();return;}
    cov+=seg;
  }
}

// ══ PIPE PATHS (reference coords) ══
// Hot gas: compressor top → condenser bottom
const PH=[[130,363],[130,207]];
// Condenser outlet → liquid tank top
const PL1=[[283,52],[390,52],[390,28]];
// Liquid tank bottom → dry filter
const PL2=[[390,202],[390,225],[452,225],[452,91]];
// Dry filter → TXV
const PL3=[[568,91],[596,91]];
// TXV → evaporator right-bottom (low pressure after expansion)
const PV1=[[618,113],[618,430],[738,430]];
// Suction: evap left-mid → compressor top
const PS=[[440,340],[175,340],[175,363]];
// Water pump → evap bottom
const PW1=[[512,488],[590,488],[590,430]];
// Water evap top → water tank
const PW2=[[590,252],[802,252]];
// Water tank → pump
const PW3=[[931,426],[931,490],[512,490],[512,488]];

// ══ DRAW COMPONENTS ══
function drawOutdoorUnit(){
  const x=rx(18),y=ry(12),w=rs(265),h=rs(195),d=rs(15);
  box3D(x,y,w,h,d,'#071e2c','#092433','#041418');
  // Fin lines
  ctx.save();ctx.beginPath();ctx.rect(x+rs(2),y+d+rs(2),w-rs(4),h-rs(4));ctx.clip();
  ctx.strokeStyle='rgba(10,40,60,.55)';ctx.lineWidth=rs(.7);
  for(let i=0;i<20;i++){const lx=x+rs(2)+i*(w-rs(4))/20;ctx.beginPath();ctx.moveTo(lx,y+d);ctx.lineTo(lx,y+d+h);ctx.stroke();}
  ctx.restore();
  // Fan housing
  const fcx=rx(153),fcy=ry(107),fr=rs(72);
  ctx.beginPath();ctx.arc(fcx,fcy,fr+rs(5),0,Math.PI*2);ctx.fillStyle='#04141e';ctx.fill();ctx.strokeStyle='#1a4a62';ctx.lineWidth=rs(1.8);ctx.stroke();
  ctx.beginPath();ctx.arc(fcx,fcy,fr,0,Math.PI*2);ctx.strokeStyle='#0a3050';ctx.lineWidth=rs(1.5);ctx.stroke();
  if(EQ.fan.run){
    for(let b=0;b<5;b++){const a=T*4.8+b*Math.PI*2/5;ctx.save();ctx.translate(fcx,fcy);ctx.rotate(a);ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,fr*.76,-.2,.26);ctx.closePath();ctx.fillStyle='rgba(0,125,195,.38)';ctx.fill();ctx.restore();}
    ctx.beginPath();ctx.arc(fcx,fcy,fr*.11,0,Math.PI*2);ctx.fillStyle='#00aaee';ctx.fill();
    ctx.beginPath();ctx.arc(fcx,fcy,fr+rs(1.5),0,Math.PI*2);ctx.strokeStyle='rgba(0,170,215,.22)';ctx.lineWidth=rs(2.2);ctx.stroke();
  }else{ctx.beginPath();ctx.arc(fcx,fcy,fr,0,Math.PI*2);ctx.fillStyle='rgba(10,30,45,.45)';ctx.fill();}
  ctx.textAlign='center';ctx.fillStyle='#1a5070';ctx.font='bold '+rs(9.5)+'px JetBrains Mono,monospace';
  ctx.fillText('AIR-COOLED FIN CONDENSER',rx(153),ry(207)+rs(14));
  ctx.fillStyle=EQ.fan.run?'#00d26a':'#4a6a7a';ctx.font='bold '+rs(8.5)+'px JetBrains Mono,monospace';
  ctx.fillText(EQ.fan.run?'FAN RUN  '+EQ.fan.kw.toFixed(1)+' kW':'FAN STOPPED',rx(153),ry(207)+rs(25));
  ctx.fillStyle='#2a5a78';ctx.font=rs(8.5)+'px JetBrains Mono,monospace';
  ctx.fillText('Ambient: '+EQ.sys.ambient.toFixed(1)+'°C  |  Condensing: '+EQ.ref.liqTemp.toFixed(1)+'°C',rx(153),ry(207)+rs(36));
}

function drawCompressor(){
  const cx=rx(130),cy=ry(415),ew=rs(84),eh=rs(42),ch=rs(105);
  cyl3D(cx,cy,ew,eh,ch,'#0a3a5a',EQ.comp.run,EQ.comp.fault);
  if(EQ.comp.run){
    for(let b=0;b<4;b++){const a=T*9+b*Math.PI/2;ctx.save();ctx.translate(cx,cy-ch/2);ctx.rotate(a);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ew*.28,0);ctx.strokeStyle='rgba(0,175,225,.7)';ctx.lineWidth=rs(2);ctx.stroke();ctx.restore();}
  }
  ctx.textAlign='center';ctx.fillStyle='#1a5070';ctx.font='bold '+rs(9.5)+'px JetBrains Mono,monospace';
  ctx.fillText('SCROLL COMPRESSOR',cx,cy+ch/2+rs(14));
  const cc=EQ.comp.fault?'#ef4444':EQ.comp.run?'#00d26a':'#6b7280';
  ctx.fillStyle=cc;ctx.font='bold '+rs(8.5)+'px JetBrains Mono,monospace';
  ctx.fillText(EQ.comp.fault?'FAULT':EQ.comp.run?EQ.comp.mode:'STOPPED',cx,cy+ch/2+rs(24));
  ctx.fillStyle='#2a5a78';ctx.font=rs(8.5)+'px JetBrains Mono,monospace';
  ctx.fillText(EQ.comp.kw.toFixed(1)+' kW  |  P↑'+EQ.ref.disch.toFixed(1)+'  P↓'+EQ.ref.suct.toFixed(1)+' bar',cx,cy+ch/2+rs(34));
}

function drawLiquidTank(){
  const cx=rx(390),cy=ry(115),ew=rs(52),eh=rs(22),ch=rs(130);
  cyl3D(cx,cy,ew,eh,ch,'#2a1800',EQ.comp.run,false);
  if(EQ.comp.run){const lh=ch*.72;ctx.beginPath();ctx.rect(cx-ew/2+rs(2),cy+ch/2-lh,ew-rs(4),lh);ctx.fillStyle='rgba(255,130,0,.35)';ctx.fill();}
  ctx.textAlign='center';ctx.fillStyle='#885500';ctx.font='bold '+rs(8.5)+'px JetBrains Mono,monospace';
  ctx.fillText('LIQUID',cx,cy-ch/2-rs(14));ctx.fillText('TANK',cx,cy-ch/2-rs(5));
  ctx.fillStyle='#664400';ctx.font=rs(8.5)+'px JetBrains Mono,monospace';
  ctx.fillText(EQ.ref.liqTemp.toFixed(1)+'°C',cx,cy+ch/2+rs(15));
}

function drawDryFilter(){
  const x=rx(452),y=ry(72),w=rs(116),h=rs(38);
  const r=h/2;
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arc(x+w-r,y+h/2,r,-.5*Math.PI,.5*Math.PI);ctx.lineTo(x+r,y+h);ctx.arc(x+r,y+h/2,r,.5*Math.PI,1.5*Math.PI);ctx.closePath();
  const grd=ctx.createLinearGradient(x,y,x,y+h);grd.addColorStop(0,'#1a3040');grd.addColorStop(.5,'#2a4858');grd.addColorStop(1,'#0e2030');
  ctx.fillStyle=grd;ctx.fill();ctx.strokeStyle='#1a5878';ctx.lineWidth=rs(1.5);ctx.stroke();
  ctx.beginPath();ctx.arc(x+r,y+h/2,r,0,Math.PI*2);ctx.fillStyle='#182a38';ctx.fill();ctx.strokeStyle='#285878';ctx.lineWidth=rs(1);ctx.stroke();
  ctx.beginPath();ctx.arc(x+w-r,y+h/2,r,0,Math.PI*2);ctx.fillStyle='#182a38';ctx.fill();ctx.stroke();
  ctx.textAlign='center';ctx.fillStyle='#1a6280';ctx.font='bold '+rs(8.5)+'px JetBrains Mono,monospace';
  ctx.fillText('DRY FILTER',x+w/2,y-rs(6));
}

function drawTXV(){
  const cx=rx(618),cy=ry(91),s=rs(22);
  ctx.beginPath();ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s,cy);ctx.lineTo(cx,cy+s);ctx.lineTo(cx-s,cy);ctx.closePath();
  ctx.fillStyle='#12283a';ctx.fill();ctx.strokeStyle='#00aacc';ctx.lineWidth=rs(2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy-s*.45);ctx.lineTo(cx+s*.45,cy);ctx.lineTo(cx,cy+s*.45);ctx.lineTo(cx-s*.45,cy);ctx.closePath();
  ctx.fillStyle='rgba(0,165,200,.28)';ctx.fill();
  ctx.textAlign='center';ctx.fillStyle='#0a8aaa';ctx.font='bold '+rs(8)+'px JetBrains Mono,monospace';
  ctx.fillText('TXV',cx,cy-s-rs(5));
  ctx.fillStyle='#0a6a88';ctx.font=rs(8)+'px JetBrains Mono,monospace';
  ctx.fillText(EQ.txv.pos.toFixed(0)+'%',cx,cy+s+rs(11));
}

function drawEvaporator(){
  const x=rx(440),y=ry(252),w=rs(298),h=rs(178),d=rs(12);
  box3D(x,y,w,h,d,'#071820','#091f28','#040f16');
  // Coil serpentine lines
  const rows=8,sp=h/rows;
  for(let i=0;i<rows;i++){
    const ly=y+d+sp*(i+.5);
    const lc=EQ.comp.run?('rgba('+(i%2?'0,170,255':'90,50,235')+',.48)'):'rgba(20,50,70,.3)';
    ctx.beginPath();ctx.moveTo(x+rs(8),ly);ctx.lineTo(x+w-rs(8),ly);ctx.strokeStyle=lc;ctx.lineWidth=rs(2.5);ctx.stroke();
    if(i<rows-1){
      const ny=y+d+sp*(i+1.5),bx=i%2===0?x+w-rs(8):x+rs(8);
      ctx.beginPath();ctx.arc(bx,(ly+ny)/2,rs(4.5),i%2===0?-Math.PI/2:Math.PI/2,i%2===0?Math.PI/2:-Math.PI/2,i%2===0);
      ctx.strokeStyle=lc;ctx.lineWidth=rs(2.5);ctx.stroke();
    }
  }
  ctx.textAlign='center';ctx.fillStyle='#1a5070';ctx.font='bold '+rs(11)+'px JetBrains Mono,monospace';
  ctx.fillText('EVAPORATOR COIL',x+w/2,y+d+h/2-rs(8));
  ctx.fillStyle='#0a4060';ctx.font=rs(9)+'px JetBrains Mono,monospace';
  ctx.fillText('EWT '+EQ.evap.wIn.toFixed(1)+'°C  →  LWT '+EQ.evap.wOut.toFixed(1)+'°C  |  ΔT '+EQ.evap.dT.toFixed(1)+'K',x+w/2,y+d+h/2+rs(8));
  // Superheat label
  ctx.fillStyle='#2a4a6a';ctx.font=rs(8.5)+'px JetBrains Mono,monospace';
  ctx.fillText('SH: '+EQ.ref.superheat.toFixed(1)+'K  |  SC: '+EQ.ref.subcool.toFixed(1)+'K  |  '+EQ.ref.ref,x+w/2,y+d+h/2+rs(20));
}

function drawWaterTank(){
  const x=rx(802),y=ry(248),w=rs(258),h=rs(178),d=rs(13);
  box3D(x,y,w,h,d,'#081c10','#0a2416','#04100a');
  // Water fill
  ctx.beginPath();ctx.rect(x+rs(2),y+d+h*.3,w-rs(4),h*.68);ctx.fillStyle='rgba(0,80,160,.22)';ctx.fill();
  // Heater element
  const hx=x+rs(18),hy=y+d+h-rs(28),hw=w-rs(36);
  ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx+hw,hy);
  ctx.strokeStyle=EQ.tank.heater?'rgba(255,90,0,.78)':'rgba(25,55,25,.4)';ctx.lineWidth=rs(4.5);ctx.stroke();
  if(EQ.tank.heater){ctx.shadowColor='#ff6600';ctx.shadowBlur=rs(7);ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx+hw,hy);ctx.strokeStyle='rgba(255,140,40,.55)';ctx.lineWidth=rs(2);ctx.stroke();ctx.shadowBlur=0;}
  ctx.textAlign='center';ctx.fillStyle='#1a6830';ctx.font='bold '+rs(13)+'px JetBrains Mono,monospace';
  ctx.fillText(EQ.tank.temp.toFixed(1)+'°C',x+w/2,y+d+h/2);
  ctx.fillStyle='#0a4820';ctx.font=rs(9)+'px JetBrains Mono,monospace';
  ctx.fillText('SP: '+EQ.tank.setpoint.toFixed(1)+'°C',x+w/2,y+d+h/2+rs(14));
  ctx.fillStyle='#1a5a28';ctx.font='bold '+rs(9.5)+'px JetBrains Mono,monospace';
  ctx.fillText('WATER STORAGE TANK',x+w/2,y+h+rs(16));
  ctx.fillStyle=EQ.tank.heater?'#ff8844':'#1e3a22';ctx.font='bold '+rs(8.5)+'px JetBrains Mono,monospace';
  ctx.fillText(EQ.tank.heater?'⚡ HEATER ON':'HEATER OFF',x+w/2,y+h+rs(26));
}

function drawPump(){
  const cx=rx(486),cy=ry(488),ew=rs(52),eh=rs(26),ch=rs(58);
  cyl3D(cx,cy,ew,eh,ch,'#183a28',EQ.pump.run,false);
  if(EQ.pump.run){for(let b=0;b<4;b++){const a=T*10+b*Math.PI/2;ctx.save();ctx.translate(cx,cy-ch/2);ctx.rotate(a);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ew*.28,0);ctx.strokeStyle='rgba(0,200,100,.72)';ctx.lineWidth=rs(1.8);ctx.stroke();ctx.restore();}}
  ctx.textAlign='center';ctx.fillStyle='#1a6838';ctx.font='bold '+rs(9)+'px JetBrains Mono,monospace';
  ctx.fillText('PUMP',cx,cy+ch/2+rs(13));
  ctx.fillStyle=EQ.pump.run?'#00d26a':'#6b7280';ctx.font=rs(8.5)+'px JetBrains Mono,monospace';
  ctx.fillText(EQ.pump.run?EQ.pump.flow.toFixed(1)+' L/s':'STOP',cx,cy+ch/2+rs(23));
}

// ══ PIPES & FLOW DOTS ══
function drawPipes(){
  const run=EQ.comp.run,pw=EQ.pump.run;
  // Hot gas
  polyPipe(PH,C_HOT,9);
  // Liquid lines
  polyPipe(PL1,C_LIQ,9);polyPipe(PL2,C_LIQ,9);polyPipe(PL3,C_LIQ,9);
  // Low pressure / suction
  polyPipe(PV1,C_VAP,9);polyPipe(PS,C_VAP,9);
  // Water circuit
  if(pw){polyPipe(PW1,C_CW,8);polyPipe(PW2,C_CR,8);polyPipe(PW3,C_CR,8);}

  // Flow dots (3 per pipe, animated)
  if(run){
    const s=(T*45)%1;
    for(let i=0;i<3;i++)flowDot(PH,(s+i/3)%1,C_HOT,rs(4.5));
    const lpAll=[...PL1,...PL2,...PL3];
    for(let i=0;i<3;i++)flowDot(lpAll,(s+i/3)%1,C_LIQ,rs(4));
    for(let i=0;i<3;i++)flowDot(PV1,((T*38)%1+i/3)%1,C_VAP,rs(4));
    for(let i=0;i<3;i++)flowDot(PS,(s+i/3)%1,C_VAP,rs(4.5));
  }
  if(pw){
    const wp=(T*42)%1;
    for(let i=0;i<2;i++)flowDot(PW1,(wp+i/2)%1,C_CW,rs(4));
    for(let i=0;i<2;i++)flowDot(PW2,(wp+i/2)%1,C_CR,rs(4));
    for(let i=0;i<2;i++)flowDot(PW3,(wp+i/2)%1,C_CR,rs(4));
  }
}

// ══ LEGEND ══
function drawLegend(){
  const lx=rx(1060),ly=ry(16),lw=rs(302),lh=rs(70);
  rrP(lx,ly,lw,lh,rs(5));ctx.fillStyle='rgba(6,16,26,.88)';ctx.fill();ctx.strokeStyle='#1a3a5a';ctx.lineWidth=rs(1);ctx.stroke();
  ctx.textAlign='left';ctx.fillStyle='#2a5a78';ctx.font='bold '+rs(8.5)+'px JetBrains Mono,monospace';
  ctx.fillText('CIRCUIT LEGEND',lx+rs(10),ly+rs(13));
  const items=[[C_HOT,'Hot Gas (Discharge)'],[C_LIQ,'Liquid Refrigerant'],[C_VAP,'Low-Pres / Suction'],[C_CW,'Chilled Water']];
  items.forEach(function(it,i){
    const ix=lx+rs(10),iy=ly+rs(24)+i*rs(12);
    ctx.beginPath();ctx.moveTo(ix,iy);ctx.lineTo(ix+rs(22),iy);ctx.strokeStyle=it[0];ctx.lineWidth=rs(3.5);ctx.stroke();
    ctx.fillStyle='#7a9aaa';ctx.font=rs(8.5)+'px JetBrains Mono,monospace';ctx.fillText(it[1],ix+rs(28),iy+rs(4));
  });
}

// ══ VALUE LABELS ══
function lbl(x,y,txt,val,col){
  const bw=rs(148),bh=rs(42),br=rs(4);
  rrP(x-bw/2,y-bh/2,bw,bh,br);ctx.fillStyle='rgba(6,14,24,.88)';ctx.fill();ctx.strokeStyle=col+'44';ctx.lineWidth=rs(.8);ctx.stroke();
  ctx.textAlign='center';ctx.fillStyle='#3a6a88';ctx.font=rs(8)+'px JetBrains Mono,monospace';ctx.fillText(txt,x,y-rs(5));
  ctx.fillStyle=col;ctx.font='bold '+rs(11)+'px JetBrains Mono,monospace';ctx.fillText(val,x,y+rs(8));
}

function drawLabels(){
  lbl(rx(162),ry(248),'DISCH PRESSURE',EQ.ref.disch.toFixed(1)+' bar','#ff4444');
  lbl(rx(162),ry(295),'SUCT PRESSURE', EQ.ref.suct.toFixed(1)+' bar','#9955ff');
  lbl(rx(330),ry(460),'SUPERHEAT',     EQ.ref.superheat.toFixed(1)+' K','#aa66ff');
  lbl(rx(490),ry(460),'SUBCOOLING',    EQ.ref.subcool.toFixed(1)+' K','#ff9900');
  lbl(rx(666),ry(460),'COOLING',       EQ.sys.coolingKw.toFixed(0)+' kW','#40c4ff');
  lbl(rx(846),ry(460),'COP / EER',     EQ.sys.cop.toFixed(2)+'/'+EQ.sys.eer.toFixed(1),'#00d26a');
  lbl(rx(618),ry(160),'TXV POSITION',  EQ.txv.pos.toFixed(0)+'%','#00aacc');
}

// ══ MAIN DRAW ══
function draw(){
  T+=.016;
  ctx.fillStyle='#1a2d42';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(18,38,58,.28)';ctx.lineWidth=rs(.4);
  for(let xi=0;xi<W;xi+=rs(40)){ctx.beginPath();ctx.moveTo(xi,0);ctx.lineTo(xi,H);ctx.stroke();}
  for(let yi=0;yi<H;yi+=rs(40)){ctx.beginPath();ctx.moveTo(0,yi);ctx.lineTo(W,yi);ctx.stroke();}
  drawPipes();
  drawOutdoorUnit();drawCompressor();drawLiquidTank();drawDryFilter();drawTXV();
  drawEvaporator();drawWaterTank();drawPump();
  drawLabels();drawLegend();
  requestAnimationFrame(draw);
}

// ══ SIMULATION ══
let tick=0;
function rw(v,d,lo,hi){return Math.max(lo,Math.min(hi,v+(Math.random()-.5)*d));}
function simulate(){
  tick++;if(tick%4!==0)return;
  if(EQ.comp.run){
    EQ.ref.disch=rw(EQ.ref.disch,.14,16.5,21.5);EQ.ref.suct=rw(EQ.ref.suct,.06,3.8,6.2);
    EQ.ref.superheat=rw(EQ.ref.superheat,.1,6,12);EQ.ref.subcool=rw(EQ.ref.subcool,.08,3,8);
    EQ.ref.liqTemp=rw(EQ.ref.liqTemp,.12,35,43);EQ.comp.kw=rw(EQ.comp.kw,.1,11,18);
    EQ.txv.pos=rw(EQ.txv.pos,.8,28,62);EQ.sys.coolingKw=rw(EQ.sys.coolingKw,1,36,58);
    EQ.sys.cop=rw(EQ.sys.cop,.04,2.8,4.2);EQ.sys.eer=EQ.sys.cop*3.412;
    EQ.evap.wOut=rw(EQ.evap.wOut,.06,6.2,9.5);EQ.evap.wIn=EQ.evap.wOut+rw(EQ.evap.dT,.1,4,7);
    EQ.evap.dT=EQ.evap.wIn-EQ.evap.wOut;EQ.fan.kw=rw(EQ.fan.kw,.04,1.2,2.0);
    if(EQ.ref.disch>20.5&&Math.random()<.08)pushAlarm('REF','High discharge pressure: '+EQ.ref.disch.toFixed(1)+' bar');
    if(EQ.ref.suct<4.0&&Math.random()<.08)pushAlarm('REF','Low suction pressure: '+EQ.ref.suct.toFixed(1)+' bar');
    if(EQ.ref.superheat>11.5&&Math.random()<.06)pushAlarm('TXV','High superheat: '+EQ.ref.superheat.toFixed(1)+' K');
  }else{EQ.sys.coolingKw=0;EQ.sys.cop=0;EQ.sys.eer=0;}
  if(EQ.pump.run){
    EQ.pump.flow=rw(EQ.pump.flow,.07,2.8,3.8);
    EQ.tank.temp=rw(EQ.tank.temp,.07,EQ.tank.setpoint-.5,EQ.tank.setpoint+2.5);
    if(EQ.tank.heater)EQ.tank.temp=rw(EQ.tank.temp,.1,EQ.tank.setpoint,EQ.tank.setpoint+3);
  }
  EQ.sys.ambient=rw(EQ.sys.ambient,.1,30,40);
  updateBadges();
}

function updateBadges(){
  const bs=document.getElementById('bSys');
  const flt=EQ.comp.fault;
  bs.className='badge '+(flt?'br':EQ.comp.run?'bg':'ba');
  bs.textContent=flt?'⚠ FAULT':EQ.comp.run?'● NORMAL':'■ STOPPED';
  document.getElementById('bComp').textContent='COMP: '+(EQ.comp.run?EQ.comp.mode:'STOP');
  document.getElementById('bCool').textContent=EQ.sys.coolingKw.toFixed(0)+' kW';
  document.getElementById('bCOP').textContent='COP '+EQ.sys.cop.toFixed(2);
}

function toggleComp(){EQ.comp.run=!EQ.comp.run;EQ.fan.run=EQ.comp.run;if(!EQ.comp.run)EQ.comp.mode='STOPPED';else EQ.comp.mode='COOLING';pushAlarm('COMP',EQ.comp.run?'Compressor started':'Compressor stopped');renderBtm();}
function togglePump(){EQ.pump.run=!EQ.pump.run;pushAlarm('PUMP',EQ.pump.run?'Pump started':'Pump stopped');renderBtm();}
function toggleHeater(){EQ.tank.heater=!EQ.tank.heater;pushAlarm('HTR',EQ.tank.heater?'Water heater ON':'Water heater OFF');renderBtm();}
function injectFault(){EQ.comp.fault=true;EQ.comp.run=false;EQ.fan.run=false;pushAlarm('COMP','FAULT: High discharge pressure — compressor tripped');}
function clearFault(){EQ.comp.fault=false;ALARMS.length=0;pushAlarm('SYS','All faults cleared');}

function renderBtm(){
  const b=document.getElementById('btm');
  const ah=ALARMS.slice(0,3).map(function(a){return '<span class="ai">⚠ '+a.id+': '+a.msg+'</span>';}).join('');
  b.innerHTML='<span style="font-size:.6rem;color:#1a3a56">ระบบ:</span>'
    +'<button class="cb '+(EQ.comp.run?'cx':'cs')+'" onclick="toggleComp()">'+(EQ.comp.run?'■ STOP COMP':'▶ START COMP')+'</button>'
    +'<button class="cb '+(EQ.pump.run?'cx':'cs')+'" onclick="togglePump()">'+(EQ.pump.run?'■ STOP PUMP':'▶ START PUMP')+'</button>'
    +'<button class="cb cw" onclick="toggleHeater()">'+(EQ.tank.heater?'■ HEATER OFF':'⚡ HEATER ON')+'</button>'
    +'<div style="width:1px;height:16px;background:#1a2a38"></div>'
    +'<button class="cb cx" onclick="injectFault()">⚡ FAULT</button>'
    +'<button class="cb cs" onclick="clearFault()">✓ CLEAR</button>'
    +'<div class="bsp"></div>'
    +'<div class="aw">'+(ah||'<span style="color:#0e2030;font-size:.6rem">No Active Alarms</span>')+'</div>';
}

// ══ CLOCK ══
const TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function clk(){const d=new Date();document.getElementById('clk').textContent=d.toLocaleTimeString('th-TH',{hour12:false})+' '+d.getDate()+' '+TM[d.getMonth()]+' '+(d.getFullYear()+543);}
setInterval(clk,1000);clk();
setInterval(simulate,100);
updateBadges();renderBtm();draw();
</script>
</body>
